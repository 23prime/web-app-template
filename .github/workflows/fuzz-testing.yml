name: Fuzz Testing

on:
  pull_request:
    paths:
      - "app/*/src/**"
      - "app/use_case/fuzz/**"
      - "app/Cargo.toml"
      - "app/Cargo.lock"
      - "mise.toml"
      - "mise.lock"
      - "mise/tasks/rs-fuzz"
      - ".github/workflows/fuzz-testing.yml"
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-testing:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        target: [create_user_input, login_input]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          rustflags: ""

      - name: Install mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run fuzz target
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '300' || '60' }}
        run: mise run rs-fuzz -- "${FUZZ_TARGET}" "${FUZZ_SECONDS}"

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: app/use_case/fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
