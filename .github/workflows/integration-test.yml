name: Integration test

on:
  push:
    branches:
      - main
    paths:
      - "app/*/src/**"
      - "app/*/Cargo.toml"
      - "app/Cargo.toml"
      - "app/Cargo.lock"
      - "db/**"
      - "mise.toml"
      - "mise.lock"
      - "mise/tasks/integration-test"
      - "tests/runn/**"
      - ".github/workflows/integration-test.yml"
  pull_request:
    paths:
      - "app/*/src/**"
      - "app/*/Cargo.toml"
      - "app/Cargo.toml"
      - "app/Cargo.lock"
      - "db/**"
      - "mise.toml"
      - "mise.lock"
      - "mise/tasks/integration-test"
      - "tests/runn/**"
      - ".github/workflows/integration-test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: cicd-sensor
        uses: cicd-sensor/cicd-sensor-action@2bc31a18949a77cd5f5bd452f24f00fbb507cdf6 # v0.0.41

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and setup
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          install_args: "rust atlas github:k1LoW/runn"
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_LOCKED: "1"

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app

      - name: Check
        run: mise run integration-test
