name: Integration test

on:
  push:
    branches:
      - main
    paths:
      - "app/*/src/**"
      - "app/*/Cargo.toml"
      - "app/Cargo.toml"
      - "app/Cargo.lock"
      - "db/**"
      - "mise.toml"
      - "mise.lock"
      - "mise/tasks/integration-test"
      - "tests/runn/**"
      - ".github/workflows/integration-test.yml"
  pull_request:
    paths:
      - "app/*/src/**"
      - "app/*/Cargo.toml"
      - "app/Cargo.toml"
      - "app/Cargo.lock"
      - "db/**"
      - "mise.toml"
      - "mise.lock"
      - "mise/tasks/integration-test"
      - "tests/runn/**"
      - ".github/workflows/integration-test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: cicd-sensor
        uses: cicd-sensor/cicd-sensor-action@2b76335ff1c2dd298e983961f7a200d3fe9076c2 # v0.0.36

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and setup
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: true
          install_args: "rust atlas github:k1LoW/runn"
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_LOCKED: "1"

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: app

      - name: Check
        run: mise run integration-test
