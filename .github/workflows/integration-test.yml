name: Integration test

on:
  push:
    branches:
      - main
    paths:
      - "app/*/src/**"
      - "app/*/Cargo.toml"
      - "app/Cargo.toml"
      - "app/Cargo.lock"
      - "db/**"
      - "mise.toml"
      - "mise.lock"
      - "mise/tasks/integration-test"
      - "tests/runn/**"
      - ".github/workflows/integration-test.yml"
  pull_request:
    paths:
      - "app/*/src/**"
      - "app/*/Cargo.toml"
      - "app/Cargo.toml"
      - "app/Cargo.lock"
      - "db/**"
      - "mise.toml"
      - "mise.lock"
      - "mise/tasks/integration-test"
      - "tests/runn/**"
      - ".github/workflows/integration-test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: cicd-sensor
        uses: cicd-sensor/cicd-sensor-action@6511eb44c91d71b2b93d71193b1bf2cb18352f66 # v0.0.38

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise and setup
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          install_args: "rust atlas github:k1LoW/runn"
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          MISE_LOCKED: "1"

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: app

      - name: Check
        run: mise run integration-test
